services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_AUTH_MODE: oidc
    environment:
      NEXT_PUBLIC_AUTH_MODE: oidc

  backend:
    environment:
      OOPSNOTE_AUTH_MODE: oidc
      OOPSNOTE_AUTH_ISSUER: ${OOPSNOTE_OIDC_AUTHORITY:-https://auth.example.com}
      OOPSNOTE_AUTH_AUDIENCE: ${OOPSNOTE_OIDC_CLIENT_ID:-}
      OOPSNOTE_AUTH_JWKS_URL: http://pocket-id:1411/.well-known/jwks.json
      OOPSNOTE_ADMIN_SUBJECTS: ${OOPSNOTE_ADMIN_SUBJECTS:-}

