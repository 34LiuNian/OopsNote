[project]
name = "oopsnote"
version = "0.1.0"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
description = "OopsNote - AI 错题管理助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.27",
    "mcp>=1.28.1,<2",
    "pillow>=11.0",
    "pymupdf>=1.26",
    "pyyaml>=6.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-deepseek>=1.0",
    "langchain-google-genai>=4.0",
    "cryptography>=45.0",
]

[project.urls]
Homepage = "https://github.com/34LiuNian/OopsNote"
Repository = "https://github.com/34LiuNian/OopsNote"
Issues = "https://github.com/34LiuNian/OopsNote/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# tests/ 直接 import scripts.*：确保 console-script 调用（uv run pytest）与
# python -m pytest 都从仓库根解析，而不是依赖 cwd 恰好位于 sys.path。
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["oopsnote*"]

[tool.setuptools.package-data]
oopsnote = ["catalog/data/*.json", "control/migrations/*.sql", "mcp/*.json", "paper/templates/*.tex"]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
    "pre-commit>=4.1",
]
