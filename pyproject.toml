[project]
name = "oopsnote"
version = "0.1.0"
license = { file = "LICENSE" }
description = "OopsNote - AI 错题管理助手"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.27",
    "mcp>=1.28.1,<2",
    "pillow>=11.0",
    "pymupdf>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oopsnote*"]

[tool.setuptools.package-data]
oopsnote = ["catalog/data/*.json", "paper/templates/*.tex"]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
