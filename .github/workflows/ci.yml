name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Quality gates
        run: make ci-backend

  frontend:
    name: Frontend (eslint + tsc + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Quality gates
        run: make ci-frontend

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: meta
        name: Compute image tag
        run: echo "image_tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compute lowercase image owner
        run: echo "image_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.image_owner }}/oopsnote-backend:main-${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ env.image_owner }}/oopsnote-backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.image_owner }}/oopsnote-frontend:main-${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ env.image_owner }}/oopsnote-frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build latex-renderer image
        uses: docker/build-push-action@v6
        with:
          context: deploy/latex-renderer
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.image_owner }}/oopsnote-latex-renderer:main-${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ env.image_owner }}/oopsnote-latex-renderer:main
          cache-from: type=gha,scope=latex-renderer
          cache-to: type=gha,scope=latex-renderer,mode=max
