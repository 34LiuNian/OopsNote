services:
  frontend:
    build:
      context: ./frontend
      args:
        OOPSNOTE_BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_OIDC_AUTHORITY: https://auth.alan-ztr.eu.org
        NEXT_PUBLIC_OIDC_CLIENT_ID: abd3d0b3-46f3-4aaa-994c-1c9258c74c1e
        NEXT_PUBLIC_OIDC_REDIRECT_URI: https://oopsnote.alan-ztr.eu.org/auth/callback
        NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: https://oopsnote.alan-ztr.eu.org/
        NEXT_PUBLIC_OIDC_SCOPE: openid profile email
        NEXT_PUBLIC_ADMIN_SUBJECTS: 5cf94ffe-c14b-4c32-9092-7ff8ab947579
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    environment:
      OOPSNOTE_STORAGE_DIR: /data
      OOPSNOTE_LATEX_RENDERER_URL: http://latex-renderer:8080
      OOPSNOTE_RPC_MAX_WORKERS: "1"
      OOPSNOTE_AUTH_ISSUER: https://auth.alan-ztr.eu.org
      OOPSNOTE_AUTH_AUDIENCE: abd3d0b3-46f3-4aaa-994c-1c9258c74c1e
      OOPSNOTE_AUTH_JWKS_URL: http://pocket-id:1411/.well-known/jwks.json
      OOPSNOTE_ADMIN_SUBJECTS: 5cf94ffe-c14b-4c32-9092-7ff8ab947579
      OOPSNOTE_SECRET_STORE_PATH: /vault/credentials.json
      OOPSNOTE_SECRET_STORE_KEY_FILE: /run/secrets/oopsnote_secret_store_key
    volumes:
      - oopsnote-data:/data
      - oopsnote-vault:/vault
      - ./deploy/pi:/app/.pi:ro
      - ./deploy/pi-rust:/app/.pi-rust:ro
    secrets:
      - oopsnote_secret_store_key
    depends_on:
      latex-renderer:
        condition: service_healthy
    networks:
      - app
      - latex-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.7.0
    env_file:
      - ./deploy/pocket-id/pocket-id.env
    environment:
      APP_URL: https://auth.alan-ztr.eu.org
      ENCRYPTION_KEY_FILE: /run/secrets/pocket_id_encryption_key
      TRUST_PROXY: "true"
    secrets:
      - pocket_id_encryption_key
    ports:
      - "127.0.0.1:14110:1411"
    volumes:
      - pocket-id-data:/app/data
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    networks:
      - app
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  latex-renderer:
    build:
      context: ./deploy/latex-renderer
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - latex-internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  oopsnote-data:
  oopsnote-vault:
  pocket-id-data:

networks:
  app:
  latex-internal:
    internal: true

secrets:
  oopsnote_secret_store_key:
    file: ./deploy/oopsnote/secrets/credential_store_key
  pocket_id_encryption_key:
    file: ./deploy/pocket-id/secrets/encryption_key
