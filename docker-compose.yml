services:
  frontend:
    build:
      context: ./frontend
      args:
        OOPSNOTE_BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-better-auth}
        NEXT_PUBLIC_OIDC_AUTHORITY: ${OOPSNOTE_OIDC_AUTHORITY:-https://auth.example.com}
        NEXT_PUBLIC_OIDC_CLIENT_ID: ${OOPSNOTE_OIDC_CLIENT_ID:-}
        NEXT_PUBLIC_OIDC_REDIRECT_URI: ${OOPSNOTE_OIDC_REDIRECT_URI:-https://oopsnote.example.com/auth/callback}
        NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI: ${OOPSNOTE_OIDC_POST_LOGOUT_REDIRECT_URI:-https://oopsnote.example.com/}
        NEXT_PUBLIC_OIDC_SCOPE: "${OOPSNOTE_OIDC_SCOPE:-openid profile email groups}"
        NEXT_PUBLIC_ADMIN_SUBJECTS: ${OOPSNOTE_ADMIN_SUBJECTS:-}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-better-auth}
      BETTER_AUTH_URL: ${OOPSNOTE_PUBLIC_URL:-https://oopsnote.example.com}
      OOPSNOTE_AUTH_DB_PATH: /auth/auth.sqlite
      OOPSNOTE_BACKEND_URL: http://backend:8000
      OOPSNOTE_BETTER_AUTH_SECRET_FILE: /run/secrets/oopsnote_better_auth_secret
      OOPSNOTE_BFF_HMAC_SECRET_FILE: /run/secrets/oopsnote_bff_hmac_secret
    volumes:
      - oopsnote-auth:/auth
    secrets:
      - oopsnote_better_auth_secret
      - oopsnote_bff_hmac_secret
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    environment:
      OOPSNOTE_STORAGE_DIR: /data
      OOPSNOTE_LATEX_RENDERER_URL: http://latex-renderer:8080
      OOPSNOTE_RPC_MAX_WORKERS: "1"
      OOPSNOTE_AUTH_MODE: ${OOPSNOTE_AUTH_MODE:-better-auth}
      OOPSNOTE_BFF_HMAC_SECRET_FILE: /run/secrets/oopsnote_bff_hmac_secret
      OOPSNOTE_SECRET_STORE_PATH: /vault/credentials.json
      OOPSNOTE_SECRET_STORE_KEY_FILE: /run/secrets/oopsnote_secret_store_key
    volumes:
      - oopsnote-data:/data
      - oopsnote-vault:/vault
      - ./deploy/pi:/app/.pi:ro
      - ./deploy/pi-rust:/app/.pi-rust:ro
    secrets:
      - oopsnote_secret_store_key
      - oopsnote_bff_hmac_secret
    depends_on:
      latex-renderer:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - latex-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  pocket-id:
    profiles: ["oidc-rollback"]
    image: ghcr.io/pocket-id/pocket-id:v2.7.0
    env_file:
      - ./deploy/pocket-id/pocket-id.env
    environment:
      APP_URL: ${OOPSNOTE_OIDC_AUTHORITY:-https://auth.example.com}
      ENCRYPTION_KEY_FILE: /run/secrets/pocket_id_encryption_key
      TRUST_PROXY: "true"
    secrets:
      - pocket_id_encryption_key
    ports:
      - "127.0.0.1:14110:1411"
    volumes:
      - pocket-id-data:/app/data
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    networks:
      - app
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  latex-renderer:
    build:
      context: ./deploy/latex-renderer
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - latex-internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  oopsnote-data:
  oopsnote-auth:
  oopsnote-vault:
  pocket-id-data:

networks:
  app:
  latex-internal:
    internal: true

secrets:
  oopsnote_better_auth_secret:
    file: ./deploy/oopsnote/secrets/better_auth_secret
  oopsnote_bff_hmac_secret:
    file: ./deploy/oopsnote/secrets/bff_hmac_secret
  oopsnote_secret_store_key:
    file: ./deploy/oopsnote/secrets/credential_store_key
  pocket_id_encryption_key:
    file: ./deploy/pocket-id/secrets/encryption_key
